packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@hono/node-server": "2.0.10"
  brace-expansion: "5.0.8"
  fast-uri: "3.1.4"
  postcss: "8.5.18"
  sharp: "0.35.3"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

onlyBuiltDependencies:
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
