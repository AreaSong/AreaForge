packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@hono/node-server": "2.0.10"
  brace-expansion: "5.0.9"
  deepmerge-ts: "8.0.0"
  fast-uri: "3.1.6"
  js-yaml: "4.3.1"
  mysql2: "3.24.3"
  nanoid: "3.3.18"
  postcss: "8.5.23"
  sharp: "0.35.3"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

onlyBuiltDependencies:
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
